<svg xmlns="http://w3.org" viewBox="0 0 900 350" width="100%" height="100%">
  <!-- Style blocks to manage look & feel -->
  <style>
    .card { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
    .card:hover { stroke: #58a6ff; fill: #161b22; cursor: pointer; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica; font-weight: bold; fill: #f0f6fc; font-size: 14px; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica; fill: #8b949e; font-size: 11px; }
    .line { stroke: #30363d; stroke-width: 2; stroke-dasharray: 4; }
  </style>

  <!-- Connective Grid Lines -->
  <line x1="150" y1="150" x2="450" y2="150" class="line" />
  <line x1="450" y1="150" x2="750" y2="150" class="line" />

  <!-- Node 1: Vocab-Tool -->
  <a href="https://github.com/digiator42/Vocab-Tool" target="_blank">
    <g>
      <rect x="50" y="90" width="200" height="120" class="card" />
      <text x="70" y="140" class="title">📚 Vocab-Tool</text>
      <text x="70" y="165" class="sub">German Learning Platform</text>
    </g>
  </a>

  <!-- Node 2: Vulnerable Bottle App -->
  <a href="https://github.com/digiator42/Vulnerable-Bottle-App" target="_blank">
    <g>
      <rect x="350" y="90" width="200" height="120" class="card" />
      <text x="365" y="140" class="title">🧪 Vuln-Bottle-App</text>
      <text x="365" y="165" class="sub">Security Testing Lab</text>
    </g>
  </a>

  <!-- Node 3: E-Commerce Lab -->
  <a href="https://github.com/digiator42/E-Commerce-Lab" target="_blank">
    <g>
      <rect x="650" y="90" width="200" height="120" class="card" />
      <text x="670" y="140" class="title">🛒 E-Commerce-Lab</text>
      <text x="670" y="165" class="sub">Testing &amp; QA Automation</text>
    </g>
  </a>
</svg>
